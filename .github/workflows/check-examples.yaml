name: Check Example Resources
on:
  push:
    branches-ignore:
      - 'renovate/**'
      - 'dependabot/**'
    paths:
      - 'examples/**'

  pull_request:
    paths:
      - 'examples/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  check-examples:
    strategy:
      matrix:
        go-version: [1.26.x]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - name: Check Example Resources
        run: |
          set -eu
          make check-examples
