name: Shellcheck

on:
  push:
    branches-ignore:
      - 'renovate/**'
      - 'dependabot/**'

  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          ignore_names: sast.sh
