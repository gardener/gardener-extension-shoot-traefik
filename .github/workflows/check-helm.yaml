name: Check Helm Templates
on:
  push:
    branches-ignore:
      - 'renovate/**'
      - 'dependabot/**'
    paths:
      - 'charts/**'

  pull_request:
    paths:
      - 'charts/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  check-helm:
    strategy:
      matrix:
        go-version: [1.26.9]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - name: Check Helm Templates
        run: |
          set -eu
          make check-helm
